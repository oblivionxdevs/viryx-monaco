<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Monaco Editor</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0f1117;
    font-family: "Segoe UI", sans-serif;
}

#app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

#tabs {
    height: 40px;
    background: #171b24;
    border-bottom: 1px solid #252a36;
    display: flex;
    align-items: center;
    overflow-x: auto;
}

.tab {
    height: 100%;
    padding: 0 16px;
    display: flex;
    align-items: center;
    cursor: pointer;
    color: #aab1c3;
    user-select: none;
}

.tab.active {
    background: #212735;
    color: white;
}

#addTab {
    width: 40px;
    height: 40px;
    border: none;
    background: transparent;
    color: white;
    cursor: pointer;
}

#editor {
    flex: 1;
}
</style>
</head>

<body>

<div id="app">
    <div id="tabs">
        <button id="addTab">+</button>
    </div>

    <div id="editor"></div>
</div>

<script src="vs/loader.js"></script>

<script>
require.config({
    paths: {
        vs: "./vs"
    }
});

require(["vs/editor/editor.main"], function () {

    monaco.editor.defineTheme("viryx", {
        base: "vs-dark",
        inherit: true,
        rules: [
            { token: "comment", foreground: "6A737D" },
            { token: "keyword", foreground: "C678DD" },
            { token: "string", foreground: "98C379" }
        ],
        colors: {
            "editor.background": "#0F1117",
            "editorLineNumber.foreground": "#596275",
            "editorLineNumber.activeForeground": "#D7DAE0",
            "editorCursor.foreground": "#7AA2F7",
            "editor.lineHighlightBackground": "#161B22"
        }
    });

    const editor = monaco.editor.create(
        document.getElementById("editor"),
        {
            language: "lua",
            theme: "viryx",

            fontSize: 15,

            fontFamily:
                "'JetBrains Mono', 'Cascadia Code', Consolas",

            minimap: {
                enabled: true
            },

            smoothScrolling: true,

            scrollBeyondLastLine: false,

            cursorSmoothCaretAnimation: true,

            roundedSelection: true,

            renderLineHighlight: "all",

            wordWrap: "off",

            bracketPairColorization: {
                enabled: true
            }
        }
    );

    const models = {};
    let currentTab = null;

    const tabsContainer =
        document.getElementById("tabs");

    function renderTabs() {

        document
            .querySelectorAll(".tab")
            .forEach(x => x.remove());

        Object.keys(models).forEach(name => {

            const tab =
                document.createElement("div");

            tab.className =
                currentTab === name
                ? "tab active"
                : "tab";

            tab.textContent = name;

            tab.onclick = () => {
                switchTab(name);
            };

            tabsContainer.insertBefore(
                tab,
                document.getElementById("addTab")
            );
        });
    }

    function createTab(name) {

        if(models[name])
            return;

        models[name] =
            monaco.editor.createModel(
                "",
                "lua"
            );

        if(currentTab === null)
            switchTab(name);

        renderTabs();
    }

    function switchTab(name) {

        if(!models[name])
            return;

        currentTab = name;

        editor.setModel(models[name]);

        renderTabs();
    }

    function closeTab(name) {

        if(!models[name])
            return;

        models[name].dispose();

        delete models[name];

        const remaining =
            Object.keys(models);

        if(currentTab === name)
        {
            if(remaining.length > 0)
                switchTab(remaining[0]);
            else
                currentTab = null;
        }

        renderTabs();
    }

    window.CreateTab = createTab;
    window.SwitchTab = switchTab;
    window.CloseTab = closeTab;

    window.GetText = function() {

        const model =
            editor.getModel();

        return model
            ? model.getValue()
            : "";
    };

    window.SetText = function(text) {

        const model =
            editor.getModel();

        if(model)
            model.setValue(text);
    };

    window.SwitchWordWrap = function(flag) {

        editor.updateOptions({
            wordWrap:
                flag ? "on" : "off"
        });
    };

    window.SwitchMinimap = function(flag) {

        editor.updateOptions({
            minimap: {
                enabled: flag
            }
        });
    };

    window.SwitchLineNumbers = function(flag) {

        editor.updateOptions({
            lineNumbers:
                flag ? "on" : "off"
        });
    };

    window.SwitchFontSize = function(size) {

        editor.updateOptions({
            fontSize: size
        });
    };

    window.SwitchFontLigatures = function(flag) {

        editor.updateOptions({
            fontLigatures: flag
        });
    };

    window.SwitchReadonly = function(flag) {

        editor.updateOptions({
            readOnly: flag
        });
    };

    createTab("main.lua");

    window.addEventListener(
        "resize",
        () => editor.layout()
    );
});
</script>

</body>
</html>
