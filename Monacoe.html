<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Monaco Editor</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0f1117;
    font-family: "Segoe UI", sans-serif;
}

#app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

/* ================= TABS ================= */

#tabs {
    height: 40px;
    background: #171b24;
    border-bottom: 1px solid #252a36;
    display: flex;
    align-items: center;
    overflow-x: auto;
    padding-left: 6px;
}

.tab {
    height: 30px;
    margin-right: 6px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    cursor: pointer;
    color: #aab1c3;
    user-select: none;
    background: #1b2030;
    border-radius: 6px;
    font-size: 12px;
}

.tab.active {
    background: #2a3350;
    color: white;
}

.tab:hover {
    background: #232a3d;
}

#addTab {
    width: 34px;
    height: 30px;
    border: none;
    background: #1b2030;
    color: white;
    cursor: pointer;
    border-radius: 6px;
    margin-left: 6px;
}

#addTab:hover {
    background: #2a3350;
}

/* ================= EDITOR ================= */

#editor {
    flex: 1;
}
</style>
</head>

<body>

<div id="app">
    <div id="tabs">
        <button id="addTab">+</button>
    </div>

    <div id="editor"></div>
</div>

<script src="vs/loader.js"></script>

<script>
require.config({ paths: { vs: "./vs" } });

require(["vs/editor/editor.main"], function () {

    // ================= THEME =================
    monaco.editor.defineTheme("viryx", {
        base: "vs-dark",
        inherit: true,
        rules: [
            { token: "comment", foreground: "6A737D" },
            { token: "keyword", foreground: "C678DD" },
            { token: "string", foreground: "98C379" }
        ],
        colors: {
            "editor.background": "#0F1117",
            "editorLineNumber.foreground": "#596275",
            "editorCursor.foreground": "#7AA2F7",
            "editor.lineHighlightBackground": "#161B22"
        }
    });

    // ================= EDITOR =================
    const editor = monaco.editor.create(
        document.getElementById("editor"),
        {
            language: "lua",
            theme: "viryx",
            fontSize: 15,
            fontFamily: "'JetBrains Mono','Cascadia Code',Consolas",
            minimap: { enabled: true },
            smoothScrolling: true,
            scrollBeyondLastLine: false,
            cursorSmoothCaretAnimation: true,
            bracketPairColorization: { enabled: true }
        }
    );

    // ================= TAB SYSTEM =================

    const tabsContainer = document.getElementById("tabs");
    const addTabBtn = document.getElementById("addTab");

    let models = {};
    let currentTab = null;
    let tabIndex = 1;

    function createTab(name) {
        const model = monaco.editor.createModel("", "lua");

        models[name] = model;

        switchTab(name);
        renderTabs();
    }

    function switchTab(name) {
        if (!models[name]) return;

        currentTab = name;
        editor.setModel(models[name]);
        renderTabs();
    }

    function closeTab(name) {
        if (!models[name]) return;

        models[name].dispose();
        delete models[name];

        const keys = Object.keys(models);

        if (keys.length > 0) {
            switchTab(keys[0]);
        } else {
            createTab("main.lua");
        }

        renderTabs();
    }

    function renderTabs() {
        document.querySelectorAll(".tab").forEach(t => t.remove());

        Object.keys(models).forEach(name => {

            const tab = document.createElement("div");
            tab.className = "tab" + (currentTab === name ? " active" : "");
            tab.textContent = name;

            // click = switch
            tab.onclick = () => switchTab(name);

            // right click = close
            tab.oncontextmenu = (e) => {
                e.preventDefault();
                closeTab(name);
            };

            tabsContainer.insertBefore(tab, addTabBtn);
        });
    }

    // ================= EXPOSE TO C# =================

    window.GetText = function () {
        return editor.getValue();
    };

    window.SetText = function (text) {
        editor.setValue(text);
    };

    window.CreateTab = createTab;
    window.SwitchTab = switchTab;
    window.CloseTab = closeTab;

    window.SwitchWordWrap = (v) => editor.updateOptions({ wordWrap: v ? "on" : "off" });
    window.SwitchMinimap = (v) => editor.updateOptions({ minimap: { enabled: v } });
    window.SwitchLineNumbers = (v) => editor.updateOptions({ lineNumbers: v ? "on" : "off" });
    window.SwitchFontSize = (v) => editor.updateOptions({ fontSize: v });

    // ================= INIT =================

    createTab("main.lua");

    addTabBtn.onclick = () => {
        createTab("tab_" + tabIndex++ + ".lua");
    };

    window.addEventListener("resize", () => editor.layout());
});
</script>

</body>
</html>
