<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Monaco Editor</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0f1117;
    font-family: "Segoe UI", sans-serif;
}

#app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    animation: appFade 0.35s ease;
}

@keyframes appFade {
    from { opacity: 0; transform: scale(0.99); }
    to   { opacity: 1; transform: scale(1); }
}

/* ================= TABS ================= */

#tabs {
    height: 42px;
    background: #171b24;
    border-bottom: 1px solid #252a36;
    display: flex;
    align-items: center;
    overflow-x: auto;
    padding: 6px 8px;
    gap: 6px;
}

.tab {
    height: 30px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    cursor: pointer;
    color: #aab1c3;
    user-select: none;

    background: #1b2030;
    border-radius: 8px;

    font-size: 12px;

    transition: all 0.18s ease;

    opacity: 0;
    transform: translateY(4px);
    animation: tabIn 0.2s ease forwards;
}

@keyframes tabIn {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.tab:hover {
    background: #232a3d;
    transform: translateY(-1px);
    color: #fff;
}

.tab.active {
    background: #2a3350;
    color: #fff;
    box-shadow: 0 0 0 1px rgba(122, 162, 247, 0.25);
}

.tab.active::after {
    content: "";
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 3px;
    height: 2px;
    background: #7aa2f7;
    border-radius: 2px;
}

/* TAB TEXT WRAPPER */
.tab span {
    display: flex;
    align-items: center;
}

/* CLOSE BUTTON */
.close {
    margin-left: 8px;
    font-size: 14px;
    opacity: 0.6;
    transition: 0.15s;
    cursor: pointer;
}

.close:hover {
    opacity: 1;
    color: #ff5c5c;
}

/* ADD TAB BUTTON */
#addTab {
    width: 34px;
    height: 30px;
    border: 1px solid #252a36;
    background: #1b2030;
    color: white;
    cursor: pointer;
    border-radius: 8px;
    transition: 0.18s ease;
}

#addTab:hover {
    background: #2a3350;
    transform: rotate(90deg);
}

/* ================= EDITOR ================= */

#editor {
    flex: 1;
}
</style>
</head>

<body>

<div id="app">
    <div id="tabs">
        <button id="addTab">+</button>
    </div>

    <div id="editor"></div>
</div>

<script src="vs/loader.js"></script>

<script>
require.config({ paths: { vs: "./vs" } });

require(["vs/editor/editor.main"], function () {

    monaco.editor.defineTheme("viryx", {
        base: "vs-dark",
        inherit: true,
        rules: [
            { token: "comment", foreground: "6A737D" },
            { token: "keyword", foreground: "C678DD" },
            { token: "string", foreground: "98C379" }
        ],
        colors: {
            "editor.background": "#0F1117",
            "editorLineNumber.foreground": "#596275",
            "editorCursor.foreground": "#7AA2F7",
            "editor.lineHighlightBackground": "#161B22"
        }
    });

    const editor = monaco.editor.create(
        document.getElementById("editor"),
        {
            language: "lua",
            theme: "viryx",
            fontSize: 15,
            fontFamily: "'JetBrains Mono','Cascadia Code',Consolas",
            minimap: { enabled: true },
            smoothScrolling: true,
            scrollBeyondLastLine: false,
            cursorSmoothCaretAnimation: true,
            bracketPairColorization: { enabled: true }
        }
    );

    const tabsContainer = document.getElementById("tabs");
    const addTabBtn = document.getElementById("addTab");

    let models = {};
    let currentTab = null;
    let tabIndex = 1;

    let changeDisposable = null;

    function attachChangeListener() {
        if (changeDisposable) changeDisposable.dispose();
        changeDisposable = editor.onDidChangeModelContent(() => {});
    }

    function createTab(name, content = "") {
        if (models[name]) return switchTab(name);

        const model = monaco.editor.createModel(content, "lua");
        models[name] = model;

        switchTab(name);
        renderTabs();
    }

    function switchTab(name) {
        if (!models[name]) return;

        currentTab = name;
        editor.setModel(models[name]);

        attachChangeListener();
        renderTabs();
    }

    function closeTab(name) {
        if (!models[name]) return;

        models[name].dispose();
        delete models[name];

        const keys = Object.keys(models);
        if (keys.length) switchTab(keys[0]);
        else createTab("main.lua");

        renderTabs();
    }

    function renameTab(oldName) {
        const newName = prompt("Rename tab:", oldName);
        if (!newName || newName === oldName) return;
        if (models[newName]) return alert("Tab already exists");

        models[newName] = models[oldName];
        delete models[oldName];

        if (currentTab === oldName) currentTab = newName;

        renderTabs();
    }

    function renderTabs() {
        document.querySelectorAll(".tab").forEach(t => t.remove());

        Object.keys(models).forEach(name => {
            const tab = document.createElement("div");

            tab.className = "tab" + (currentTab === name ? " active" : "");

            const text = document.createElement("span");
            text.textContent = name;

            const close = document.createElement("span");
            close.textContent = "×";
            close.className = "close";

            close.onclick = (e) => {
                e.stopPropagation();
                closeTab(name);
            };

            tab.onclick = () => switchTab(name);

            tab.ondblclick = () => renameTab(name);

            tab.oncontextmenu = (e) => {
                e.preventDefault();
                const ok = confirm("Rename tab?\nOK = rename\nCancel = close");
                if (ok) renameTab(name);
                else closeTab(name);
            };

            tab.appendChild(text);
            tab.appendChild(close);

            tabsContainer.insertBefore(tab, addTabBtn);
        });
    }

    // ================= EXPOSE =================

    window.GetText = () => editor.getValue();
    window.SetText = (t) => editor.setValue(t);

    window.CreateTab = createTab;
    window.SwitchTab = switchTab;
    window.CloseTab = closeTab;

    // ================= INIT =================

    createTab("main.lua");

    addTabBtn.onclick = () => {
        createTab("tab_" + tabIndex++ + ".lua");
    };

    window.addEventListener("resize", () => editor.layout());
});
</script>

</body>
</html>
