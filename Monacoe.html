<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Monaco Editor</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0f1117;
    font-family: "Segoe UI", sans-serif;
}

#app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

/* ================= TABS ================= */

#tabs {
    height: 42px;
    background: linear-gradient(180deg, #171b24, #141824);
    border-bottom: 1px solid #252a36;
    display: flex;
    align-items: center;
    overflow-x: auto;
    padding: 6px;
    gap: 6px;
}

/* TAB */
.tab {
    display: flex;
    align-items: center;
    gap: 8px;

    padding: 6px 10px;
    border-radius: 8px;

    background: #1b2030;
    color: #aab1c3;

    font-size: 12px;
    user-select: none;
    cursor: grab;

    transition: all 0.15s ease;
    animation: tabIn 0.15s ease;
}

.tab:active {
    cursor: grabbing;
}

/* hover */
.tab:hover {
    background: #232a3d;
    transform: translateY(-1px);
}

/* active */
.tab.active {
    background: #2a3350;
    color: white;
    box-shadow: inset 0 0 0 1px #3a4668;
}

/* lua icon */
.tab .icon {
    font-size: 13px;
    opacity: 0.9;
}

/* close */
.tab .close {
    margin-left: 6px;
    font-size: 12px;
    opacity: 0.7;
    transition: 0.15s;
}

.tab .close:hover {
    opacity: 1;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
}

/* add tab */
#addTab {
    width: 32px;
    height: 30px;
    border: none;
    background: #1b2030;
    color: white;
    cursor: pointer;
    border-radius: 8px;
}

#addTab:hover {
    background: #2a3350;
}

/* drag effect */
.tab.dragging {
    opacity: 0.5;
    transform: scale(0.95);
}

/* editor */
#editor {
    flex: 1;
}

@keyframes tabIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div id="app">
    <div id="tabs">
        <button id="addTab">+</button>
    </div>
    <div id="editor"></div>
</div>

<script src="vs/loader.js"></script>

<script>
require.config({ paths: { vs: "./vs" } });

require(["vs/editor/editor.main"], function () {

    /* ================= THEME ================= */
    monaco.editor.defineTheme("viryx", {
        base: "vs-dark",
        inherit: true,
        rules: [
            { token: "comment", foreground: "6A737D" },
            { token: "keyword", foreground: "C678DD" },
            { token: "string", foreground: "98C379" }
        ],
        colors: {
            "editor.background": "#0F1117",
            "editorLineNumber.foreground": "#596275",
            "editorCursor.foreground": "#7AA2F7",
            "editor.lineHighlightBackground": "#161B22"
        }
    });

    /* ================= EDITOR ================= */
    const editor = monaco.editor.create(document.getElementById("editor"), {
        language: "lua",
        theme: "viryx",
        fontSize: 15,
        fontFamily: "'JetBrains Mono','Cascadia Code',Consolas",
        minimap: { enabled: true },
        smoothScrolling: true,
        scrollBeyondLastLine: false,
        bracketPairColorization: { enabled: true }
    });

    /* ================= STATE ================= */
    const STORAGE_KEY = "viryx_tabs_drag_v1";

    let models = {};
    let order = [];
    let currentTab = null;
    let tabIndex = 1;
    let changeDisposable = null;

    const tabsContainer = document.getElementById("tabs");
    const addTabBtn = document.getElementById("addTab");

    function save() {
        const data = {
            currentTab,
            order,
            tabIndex,
            tabs: {}
        };

        for (const k of Object.keys(models)) {
            data.tabs[k] = models[k].getValue();
        }

        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function load() {
        try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY));
        } catch {
            return null;
        }
    }

    function bindChange() {
        if (changeDisposable) changeDisposable.dispose();
        changeDisposable = editor.onDidChangeModelContent(save);
    }

    /* ================= TAB CORE ================= */

    function createTab(name, content = "") {
        if (models[name]) return switchTab(name);

        const model = monaco.editor.createModel(content, "lua");
        models[name] = model;

        order.push(name);

        switchTab(name);
        render();
        save();
    }

    function switchTab(name) {
        if (!models[name]) return;

        currentTab = name;
        editor.setModel(models[name]);

        bindChange();
        render();
        save();
    }

    function closeTab(name) {
        if (!models[name]) return;

        models[name].dispose();
        delete models[name];

        order = order.filter(x => x !== name);

        if (order.length) {
            switchTab(order[0]);
        } else {
            createTab("main.lua");
        }

        render();
        save();
    }

    function renameTab(oldName) {
        const newName = prompt("Rename tab:", oldName);
        if (!newName || newName === oldName) return;
        if (models[newName]) return alert("Tab exists");

        models[newName] = models[oldName];
        delete models[oldName];

        order = order.map(x => x === oldName ? newName : x);

        if (currentTab === oldName) currentTab = newName;

        switchTab(newName);
        render();
        save();
    }

    /* ================= DRAG & DROP ================= */

    let dragged = null;

    function setupDrag(tab, name) {
        tab.draggable = true;

        tab.ondragstart = () => {
            dragged = name;
            tab.classList.add("dragging");
        };

        tab.ondragend = () => {
            dragged = null;
            tab.classList.remove("dragging");
        };

        tab.ondragover = (e) => {
            e.preventDefault();
        };

        tab.ondrop = (e) => {
            e.preventDefault();
            if (!dragged || dragged === name) return;

            const from = order.indexOf(dragged);
            const to = order.indexOf(name);

            order.splice(from, 1);
            order.splice(to, 0, dragged);

            render();
            save();
        };
    }

    /* ================= RENDER ================= */

    function render() {
        document.querySelectorAll(".tab").forEach(t => t.remove());

        order.forEach(name => {
            const tab = document.createElement("div");
            tab.className = "tab" + (currentTab === name ? " active" : "");

            /* icon (lua executor vibe) */
            const icon = document.createElement("span");
            icon.className = "icon";
            icon.textContent = "🟣";

            const label = document.createElement("span");
            label.textContent = name;

            label.ondblclick = () => renameTab(name);

            const close = document.createElement("span");
            close.className = "close";
            close.textContent = "×";
            close.onclick = (e) => {
                e.stopPropagation();
                closeTab(name);
            };

            tab.appendChild(icon);
            tab.appendChild(label);
            tab.appendChild(close);

            tab.onclick = () => switchTab(name);

            setupDrag(tab, name);

            tabsContainer.insertBefore(tab, addTabBtn);
        });
    }

    /* ================= EXPOSE ================= */

    window.CreateTab = createTab;
    window.SwitchTab = switchTab;
    window.CloseTab = closeTab;
    window.RenameTab = renameTab;

    window.GetText = () => editor.getValue();
    window.SetText = (t) => editor.setValue(t);

    window.SwitchWordWrap = v => editor.updateOptions({ wordWrap: v ? "on" : "off" });
    window.SwitchMinimap = v => editor.updateOptions({ minimap: { enabled: v } });

    /* ================= INIT ================= */

    const saved = load();

    if (saved && saved.tabs) {
        models = {};
        order = saved.order || Object.keys(saved.tabs);

        for (const [name, content] of Object.entries(saved.tabs)) {
            models[name] = monaco.editor.createModel(content, "lua");
        }

        currentTab = saved.currentTab && models[saved.currentTab]
            ? saved.currentTab
            : order[0];

        tabIndex = saved.tabIndex || 1;

        switchTab(currentTab);
        render();
    } else {
        createTab("main.lua");
    }

    addTabBtn.onclick = () => {
        createTab("tab_" + tabIndex++ + ".lua");
    };

    window.addEventListener("resize", () => editor.layout());
});
</script>

</body>
</html>
